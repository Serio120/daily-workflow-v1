name: Daily Standup → GitHub

on:
  workflow_dispatch:
    inputs:
      team_member:
        description: 'Nombre del miembro'
        required: true
        type: string
      yesterday:
        description: 'Qué hice ayer'
        required: true
        type: string
      today:
        description: 'Qué haré hoy'
        required: true
        type: string
      blockers:
        description: 'Bloqueadores (opcional)'
        required: false
        type: string

  issues:
    types: [opened, labeled]

  schedule:
    # Every day at 08:00 UTC, including weekends and public holidays.
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write

jobs:
  capture-daily:
    # Issue events are accepted only when the issue carries the daily label.
    if: github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'daily') && (github.event.action == 'opened' || github.event.label.name == 'daily'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +'%A')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +'V%V-%G')" >> "$GITHUB_OUTPUT"

      - name: Parse issue form
        if: github.event_name == 'issues'
        id: issue-input
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue?.body || '';

            const pick = (label) => {
              const re = new RegExp(`###\\s*[^\\n]*${label}[^\\n]*\\n+([\\s\\S]*?)(?=\\n###\\s|$)`, 'i');
              const match = body.match(re);
              return match?.[1]?.trim() || '';
            };

            core.setOutput('team_member', pick('Nombre') || context.payload.issue.user.login);
            core.setOutput('yesterday', pick('Ayer') || 'Sin datos');
            core.setOutput('today', pick('Hoy') || 'Sin datos');
            core.setOutput('blockers', pick('Bloqueadores') || 'Ninguno');

      - name: Generate daily file and update log
        id: generate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEAM_MEMBER: ${{ github.event.inputs.team_member || steps.issue-input.outputs.team_member || 'Equipo' }}
          YESTERDAY: ${{ github.event.inputs.yesterday || steps.issue-input.outputs.yesterday || 'Sin datos' }}
          TODAY: ${{ github.event.inputs.today || steps.issue-input.outputs.today || 'Planificación diaria' }}
          BLOCKERS: ${{ github.event.inputs.blockers || steps.issue-input.outputs.blockers || 'Ninguno' }}
          DAILY_DATE: ${{ steps.date.outputs.date }}
          DAILY_DAY: ${{ steps.date.outputs.day }}
          DAILY_WEEK: ${{ steps.date.outputs.week }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          source = {"workflow_dispatch": "manual", "issues": "issue"}.get(event, "schedule")
          member = os.environ["TEAM_MEMBER"]
          yesterday = os.environ["YESTERDAY"]
          today = os.environ["TODAY"]
          blockers = os.environ["BLOCKERS"]
          date = os.environ["DAILY_DATE"]
          day = os.environ["DAILY_DAY"]
          week = os.environ["DAILY_WEEK"]

          daily_path = Path(".daily") / f"{date}.md"
          daily_path.parent.mkdir(parents=True, exist_ok=True)
          daily_path.write_text(
              f"---\ndate: {date}\nday: {day}\nweek: {week}\n"
              # JSON string quoting is valid YAML double-quoted scalar syntax and escapes each backslash.\n          quoted_member = json.dumps(member, ensure_ascii=False)\n          f"source: {source}\nteam_member: {quoted_member}\n---\n\n"
              f"# Daily Standup - {date}\n\n"
              f"## Ayer\n{yesterday}\n\n"
              f"## Hoy\n{today}\n\n"
              f"## Bloqueadores\n{blockers}\n",
              encoding="utf-8",
          )

          with Path("DAILY_LOG.md").open("a", encoding="utf-8") as log:
              log.write(
                  f"\n\n## {date} - {day}\n\n"
                  f"- **Miembro:** {member}\n"
                  f"- **Ayer:** {yesterday}\n"
                  f"- **Hoy:** {today}\n"
                  f"- **Bloqueadores:** {blockers}\n"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source={source}\nmember={member.replace(chr(10), ' ')}\nfile_path={daily_path}\n")
          PY

      - name: Configure git
        run: |
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add DAILY_LOG.md .daily
          git commit -m "Daily: ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          git push

      - name: Create follow-up issue
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.date.outputs.date }}';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 Daily ${date}`,
              body: `Se registró el daily del día ${date}.`,
              labels: ['daily', 'seguimiento']
            });
